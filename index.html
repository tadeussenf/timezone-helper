<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timezone Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.985 0.005 80);
    --bg-raised: oklch(1 0 0);
    --bg-sunken: oklch(0.965 0.006 80);
    --ink: oklch(0.22 0.015 270);
    --ink-2: oklch(0.42 0.015 270);
    --ink-3: oklch(0.62 0.012 270);
    --ink-4: oklch(0.78 0.008 270);
    --line: oklch(0.92 0.006 80);
    --line-2: oklch(0.88 0.008 80);

    /* Hour band colors */
    --night: oklch(0.93 0.006 270);
    --night-ink: oklch(0.55 0.012 270);
    --morning: oklch(1 0 0);
    --work: oklch(0.95 0.035 230);
    --evening: oklch(1 0 0);

    /* Accents */
    --peach: oklch(0.78 0.11 50);
    --peach-soft: oklch(0.92 0.05 50);
    --peach-deep: oklch(0.55 0.14 45);
    --sage: oklch(0.82 0.06 160);
    --sage-soft: oklch(0.94 0.035 160);
    --sage-deep: oklch(0.45 0.08 160);
    --lavender: oklch(0.75 0.05 290);
    --amber: oklch(0.85 0.10 85);
    --amber-deep: oklch(0.55 0.13 70);

    --shadow-sm: 0 1px 2px oklch(0.3 0.02 270 / 0.04), 0 2px 4px oklch(0.3 0.02 270 / 0.03);
    --shadow-md: 0 4px 12px oklch(0.3 0.02 270 / 0.05), 0 2px 6px oklch(0.3 0.02 270 / 0.04);
    --shadow-lg: 0 16px 40px oklch(0.3 0.02 270 / 0.09), 0 4px 12px oklch(0.3 0.02 270 / 0.05);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: "ss02"; }

  /* ---- Top bar ---- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-raised);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--peach) 0%, var(--amber) 60%, var(--sage) 100%);
    display: grid; place-items: center;
    box-shadow: var(--shadow-sm);
    position: relative;
  }
  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: var(--bg-raised);
    box-shadow: inset 0 0 0 1.5px var(--ink);
  }
  .brand-mark::before {
    content: "";
    position: absolute;
    width: 1.5px;
    height: 8px;
    background: var(--ink);
    border-radius: 2px;
    top: 9px;
    z-index: 2;
    transform-origin: bottom center;
    transform: rotate(30deg);
    left: calc(50% - 0.75px);
  }
  .brand-name {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 1px;
  }

  .top-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    font: 500 13px/1 'Inter', sans-serif;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid var(--line-2);
    background: var(--bg-raised);
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: background 120ms, border-color 120ms, transform 120ms;
  }
  .btn:hover { background: var(--bg-sunken); border-color: var(--ink-4); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .btn.primary:hover { background: oklch(0.3 0.015 270); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--bg-sunken); }
  .btn svg { width: 14px; height: 14px; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--sage-soft);
    color: var(--sage-deep);
    font-size: 12px;
    font-weight: 500;
    border-radius: 999px;
    border: 1px solid oklch(0.88 0.04 160);
  }
  .chip-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--sage-deep);
  }

  /* ---- Meeting bar (second row) ---- */
  .meeting-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-sunken);
    flex-wrap: wrap;
  }
  .meeting-status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .meeting-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--peach-soft);
    border: 1px solid oklch(0.86 0.07 50);
    border-radius: 10px;
    color: var(--peach-deep);
    font-weight: 600;
    font-size: 13px;
  }
  .meeting-hint {
    font-size: 12px;
    color: var(--ink-3);
    font-style: italic;
  }

  /* ---- Main grid ---- */
  .workspace {
    display: grid;
    grid-template-columns: 64px 1fr;
    height: calc(100vh - 66px);
    min-height: 0;
  }

  /* Hour rail */
  .rail {
    position: relative;
    border-right: 1px solid var(--line);
    background: var(--bg-raised);
    overflow: hidden;
  }
  .rail-header {
    height: 92px;
    border-bottom: 1px solid var(--line);
    display: grid;
    place-items: center;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    background: var(--bg-raised);
  }
  .rail-scroll {
    height: calc(100% - 92px);
    overflow: hidden;
  }
  .rail-inner {
    position: relative;
  }
  .rail-tick {
    height: 52px;
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 6px 10px 0 0;
    font-size: 11px;
    color: var(--ink-3);
    border-bottom: 1px dashed oklch(0.94 0.005 80);
  }

  /* Columns area */
  .columns-wrap {
    overflow: hidden;
    position: relative;
  }
  .columns-scroll {
    height: 100%;
    overflow-y: auto;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .columns {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(210px, 1fr);
    min-width: 100%;
    min-height: 100%;
  }

  /* Column */
  .col {
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg-raised);
  }
  .col:last-child { border-right: none; }
  .col.is-home .col-header { background: linear-gradient(180deg, oklch(0.99 0.012 80) 0%, var(--bg-raised) 100%); }

  .col-header {
    height: 92px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg-raised);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .col-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .col-flag {
    font-size: 18px;
    line-height: 1;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--bg-sunken);
    border: 1px solid var(--line-2);
    display: inline-grid;
    place-items: center;
    font-weight: 600;
    font-size: 11px;
    color: var(--ink-2);
  }
  .col-city {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .col-remove {
    opacity: 0;
    transition: opacity 120ms;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--ink-3);
    padding: 2px;
    border-radius: 4px;
    line-height: 0;
  }
  .col-remove:hover { color: var(--peach-deep); background: var(--peach-soft); }
  .col:hover .col-remove { opacity: 1; }

  .col-meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .col-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .col-time .secs {
    color: var(--ink-3);
    font-size: 13px;
  }
  .col-date {
    font-size: 11px;
    color: var(--ink-3);
    font-weight: 500;
  }
  .col-offset {
    font-size: 10px;
    color: var(--ink-3);
    font-family: 'JetBrains Mono', monospace;
  }
  .col-offset .diff {
    color: var(--peach-deep);
    font-weight: 600;
  }
  .col-offset .diff.behind { color: var(--sage-deep); }
  .col-dst {
    font-size: 9.5px;
    padding: 2px 5px;
    border-radius: 4px;
    background: oklch(0.97 0.04 85);
    color: var(--amber-deep);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border: 1px solid oklch(0.9 0.07 85);
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  /* Hour cells */
  .col-body { position: relative; }
  .hour {
    height: 52px;
    border-bottom: 1px solid oklch(0.955 0.005 80);
    position: relative;
    transition: background 80ms;
    cursor: crosshair;
    display: flex;
    align-items: flex-start;
    padding: 6px 10px;
  }
  .hour.night { background: var(--night); color: var(--night-ink); }
  .hour.early { background: var(--morning); }
  .hour.work { background: var(--work); }
  .hour.evening { background: var(--evening); }
  .hour.weekend::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        -45deg,
        transparent 0,
        transparent 8px,
        oklch(0.8 0.04 290 / 0.08) 8px,
        oklch(0.8 0.04 290 / 0.08) 9px
      );
    pointer-events: none;
  }
  .hour.dayturn {
    border-top: 2px solid oklch(0.8 0.04 290 / 0.5);
  }
  .hour-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-3);
    font-weight: 500;
    opacity: 0.75;
  }
  .hour.night .hour-label { color: var(--night-ink); }
  .hour.dayturn .hour-label::after {
    content: attr(data-newday);
    margin-left: 8px;
    font-weight: 600;
    color: oklch(0.55 0.08 290);
  }

  /* Hover highlight (synced across all columns) */
  .hour.hover-source {
    background: var(--peach-soft) !important;
    box-shadow: inset 0 0 0 1.5px var(--peach);
  }
  .hour.hover-sync {
    background: var(--sage-soft) !important;
    box-shadow: inset 0 0 0 1px var(--sage);
  }
  .hour.hover-source .hour-label,
  .hour.hover-sync .hour-label {
    color: var(--ink);
    opacity: 1;
    font-weight: 600;
  }

  /* Selected meeting block */
  .meeting-block {
    position: absolute;
    left: 6px;
    right: 6px;
    background: oklch(0.85 0.09 50 / 0.55);
    border: 1.5px solid var(--peach);
    border-radius: 8px;
    pointer-events: none;
    box-shadow: 0 4px 10px oklch(0.6 0.14 45 / 0.15);
    z-index: 2;
  }
  .meeting-block .meeting-label {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--peach-deep);
    font-family: 'JetBrains Mono', monospace;
  }
  .meeting-block .meeting-dur {
    position: absolute;
    bottom: 6px;
    left: 8px;
    font-size: 10px;
    color: var(--peach-deep);
    opacity: 0.8;
  }

  /* Selection preview (during drag) */
  .drag-preview {
    position: absolute;
    left: 6px;
    right: 6px;
    background: oklch(0.88 0.08 50 / 0.35);
    border: 1.5px dashed var(--peach);
    border-radius: 8px;
    pointer-events: none;
    z-index: 3;
  }

  /* Now line */
  .now-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 0;
    border-top: 1.5px solid var(--peach-deep);
    pointer-events: none;
    z-index: 4;
  }
  .now-line::before {
    content: "";
    position: absolute;
    left: -5px;
    top: -4.5px;
    width: 8px;
    height: 8px;
    background: var(--peach-deep);
    border-radius: 50%;
  }
  .now-badge {
    position: absolute;
    top: -9px;
    right: 6px;
    background: var(--peach-deep);
    color: white;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    padding: 2px 5px;
    border-radius: 4px;
    letter-spacing: 0.03em;
  }

  /* Empty add-column */
  .add-col {
    min-width: 210px;
    border-right: 1px solid var(--line);
    border-left: 1px dashed var(--line-2);
    background: var(--bg-sunken);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 32px;
  }
  .add-col-btn {
    padding: 14px 18px;
    border-radius: 14px;
    border: 1.5px dashed var(--line-2);
    background: var(--bg-raised);
    color: var(--ink-2);
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: all 150ms;
  }
  .add-col-btn:hover {
    border-color: var(--peach);
    color: var(--peach-deep);
    background: var(--peach-soft);
  }
  .add-col-btn svg { width: 20px; height: 20px; }

  /* ---- Add zone modal ---- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: oklch(0.3 0.02 270 / 0.3);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    animation: fadein 120ms ease-out;
  }
  @keyframes fadein {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal {
    background: var(--bg-raised);
    border-radius: 18px;
    box-shadow: var(--shadow-lg);
    width: min(520px, 100%);
    max-height: min(640px, 90vh);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: popin 160ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  @keyframes popin {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-head {
    padding: 18px 22px 10px;
    border-bottom: 1px solid var(--line);
  }
  .modal-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .modal-sub {
    font-size: 12.5px;
    color: var(--ink-3);
    margin: 0;
  }
  .search-wrap {
    position: relative;
    padding: 14px 22px 12px;
  }
  .search-input {
    width: 100%;
    padding: 11px 14px 11px 38px;
    border-radius: 10px;
    border: 1px solid var(--line-2);
    background: var(--bg-sunken);
    font: 400 14px 'Inter', sans-serif;
    color: var(--ink);
    outline: none;
    transition: border-color 120ms;
  }
  .search-input:focus { border-color: var(--peach); background: var(--bg-raised); }
  .search-icon {
    position: absolute;
    left: 34px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-3);
    pointer-events: none;
  }
  .quick-picks {
    padding: 0 22px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .qp-label {
    width: 100%;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .qp-btn {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--line-2);
    background: var(--bg-raised);
    font-size: 12px;
    color: var(--ink-2);
    cursor: pointer;
    transition: all 120ms;
  }
  .qp-btn:hover { border-color: var(--peach); color: var(--peach-deep); }
  .qp-btn.added {
    background: var(--sage-soft);
    border-color: var(--sage);
    color: var(--sage-deep);
  }

  .search-results {
    flex: 1;
    overflow-y: auto;
    padding: 4px 12px 16px;
  }
  .search-result {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 100ms;
  }
  .search-result:hover { background: var(--bg-sunken); }
  .sr-flag {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--bg-sunken);
    border: 1px solid var(--line-2);
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 11px;
    color: var(--ink-2);
    flex-shrink: 0;
  }
  .sr-main {
    flex: 1;
    min-width: 0;
  }
  .sr-city {
    font-weight: 500;
    font-size: 14px;
    color: var(--ink);
  }
  .sr-region {
    font-size: 11.5px;
    color: var(--ink-3);
  }
  .sr-time {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-2);
  }
  .sr-time .diff { display: block; font-size: 10px; color: var(--ink-3); }
  .sr-added {
    font-size: 11px;
    color: var(--sage-deep);
    font-weight: 600;
    padding: 4px 8px;
    background: var(--sage-soft);
    border-radius: 6px;
  }

  /* ---- Share toast ---- */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow-lg);
    z-index: 200;
    animation: slideup 200ms ease-out;
  }
  @keyframes slideup {
    from { opacity: 0; transform: translate(-50%, 12px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  .toast svg { width: 14px; height: 14px; color: var(--sage); }

  /* ---- Tweaks panel ---- */
  .tweaks {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 260px;
    background: var(--bg-raised);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--line);
    padding: 14px;
    z-index: 80;
    font-size: 12.5px;
  }
  .tweaks h4 {
    margin: 0 0 10px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .tweak-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
  }
  .tweak-row label { color: var(--ink-2); cursor: pointer; }
  .tweak-row select, .tweak-row input[type="time"] {
    font: 400 12px 'Inter', sans-serif;
    padding: 4px 6px;
    border: 1px solid var(--line-2);
    border-radius: 6px;
    background: var(--bg);
  }
  .switch {
    position: relative;
    width: 34px;
    height: 18px;
    background: var(--line);
    border-radius: 999px;
    cursor: pointer;
    transition: background 120ms;
  }
  .switch.on { background: var(--sage-deep); }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px; height: 14px;
    background: white;
    border-radius: 50%;
    transition: left 120ms;
    box-shadow: var(--shadow-sm);
  }
  .switch.on::after { left: 18px; }

  /* Scrollbar */
  .columns-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .columns-scroll::-webkit-scrollbar-track { background: var(--bg-sunken); }
  .columns-scroll::-webkit-scrollbar-thumb {
    background: var(--line-2);
    border-radius: 6px;
    border: 2px solid var(--bg-sunken);
  }
  .columns-scroll::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }
</style>
</head>
